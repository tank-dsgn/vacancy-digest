name: Daily vacancy digest

on:
  # Main trigger: an external cron (cron-job.org) calls the workflow_dispatch API at 9:00 Minsk with auto=true.
  # GitHub's own schedule was 7-8 hours late, so it stays only as a fallback; the guard prevents duplicates.
  schedule:
    - cron: "17 5 * * *"
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      auto:
        description: "Set by the external cron: skip if today's digest was already sent"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Skip if today's digest was already sent
        id: guard
        run: |
          today=$(TZ=Europe/Minsk date +%d.%m.%Y)
          auto="${{ github.event.inputs.auto }}"
          if { [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$auto" = "true" ]; } && [ "$(cat last_sent.txt 2>/dev/null)" = "$today" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Digest for $today already sent, skipping."
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Collect vacancies and send to Telegram
        if: steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_USD: ${{ secrets.MIN_USD }}
          MY_TARGET: ${{ secrets.MY_TARGET }}
          COMPANIES: ${{ secrets.COMPANIES }}
          HOME_CITY: ${{ secrets.HOME_CITY }}
          TZ: Europe/Minsk
        run: |
          python -I generate.py --telegram
          TZ=Europe/Minsk date +%d.%m.%Y > last_sent.txt

      - name: Save history
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "vacancy-digest"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json history.json analysis.json last_sent.txt
          git diff --cached --quiet || git commit -m "Digest $(TZ=Europe/Minsk date +%Y-%m-%d)"
          git push
