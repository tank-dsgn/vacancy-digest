name: Read Telegram marks

# Every hour: read button presses and text replies to the digest, save them (encrypted) and confirm in Telegram.
# Telegram keeps updates for 24 hours, so a late or skipped run loses nothing as long as one runs per day.
on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digest          # shared with the daily digest: never two writers at once
  cancel-in-progress: false

jobs:
  marks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read marks
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          TZ: Europe/Minsk
        run: python -I generate.py --poll

      - name: Save marks
        run: |
          [ -f state.enc ] || exit 0
          git config user.name "vacancy-digest"
          git config user.email "actions@users.noreply.github.com"
          git add state.enc
          git diff --cached --quiet || git commit -m "Marks $(TZ=Europe/Minsk date +%Y-%m-%d)"
          git push
